<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi página web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #0066cc;
        }
        a {
            color: #0066cc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>¡Hola, bienvenido a mi web!</h1>
        <p>Esta es una página web básica creada con HTML y CSS.</p>
        
        <h2>Mis secciones favoritas</h2>
        <ul>
            <li>Inicio</li>
            <li>Sobre mí</li>
            <li>Contacto</li>
        </ul>

        <p>Visita <a href="https://developer.mozilla.org/es/docs/Learn_web_development/Getting_started/Your_first_website/Creating_the_content">MDN Web Docs</a> para aprender más sobre desarrollo web.</p>
    </div>

</body>
</html>
